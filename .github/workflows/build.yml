name: Gerar StoneApk Oficial Assinado (Android e iOS)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Criar Projeto Android
        run: |
          cordova create app com.aniceto.stoneapk StoneApk
          cd app
          
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.aniceto.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Aniceto Informatica</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='http://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          
          echo "    <preference name='KeepRunning' value='true' />" >> config.xml
          echo "    <preference name='AllowInlineMediaPlayback' value='true' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          cordova platform add android
          # Compilação em modo Release (Produção) oficial
          cordova build android --release

      - name: Assinar e Alinhar o APK de Produção
        env:
          SENHA_DO_USUARIO: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd app
          # 1. Cria a chave de segurança com o seu KEYSTORE_PASSWORD
          keytool -genkeypair -v -keystore stoneapk.keystore -alias stone_chave -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SENHA_DO_USUARIO" -keypass "$SENHA_DO_USUARIO" -dname "CN=Aniceto, OU=Informatica, O=StoneApk, L=SaoPaulo, S=SP, C=BR"
          
          # 2. Localiza o APK Release não assinado gerado pelo Gradle
          APK_RELEASE=$(find platforms/android/app/build/outputs/apk/release/ -name "*-unsigned.apk" | head -n 1)
          
          # 3. Alinha os binários do aplicativo (Obrigatório para o Android aceitar a instalação)
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 "$APK_RELEASE" ../StoneApk-Aligned.apk
          
          # 4. Aplica a assinatura criptográfica final em cima do arquivo alinhado
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore stoneapk.keystore -storepass "$SENHA_DO_USUARIO" -keypass "$SENHA_DO_USUARIO" ../StoneApk-Aligned.apk stone_chave
          
          # 5. Move para o destino final com o nome correto
          mv ../StoneApk-Aligned.apk ../StoneApk.apk

      - name: Upload Android APK Assinado
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-Android-Assinado
          path: StoneApk.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Criar Projeto iOS
        run: |
          cordova create app com.aniceto.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.aniceto.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          cordova platform add ios
          cordova prepare ios
          cd ..
          zip -r ./StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-iOS-Xcode-Project
          path: StoneApk-Xcode-Project.zip
