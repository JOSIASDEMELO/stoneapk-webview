name: Gerar APK Oficial Assinado e Estrutura iOS

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          
          # Criando o config.xml com os namespaces oficiais e link correto da subpasta
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Aniceto Informatica</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          
          # Abre as permissões internas para manter sessões e autenticação ativas
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='http://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          
          echo "    <preference name='KeepRunning' value='true' />" >> config.xml
          echo "    <preference name='AllowInlineMediaPlayback' value='true' />" >> config.xml
          
          # Injeta o ícone
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          # Adiciona a plataforma travando na versão estável do motor Android
          cordova platform add android@12.0.0
          cordova build android --release

      - name: Assinar APK usando Chave Digital Direta
        env:
          SENHA_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd app
          # Cria o repositório de chaves usando a sua senha KEYSTORE_PASSWORD criada nos Secrets
          keytool -genkeypair -v -keystore stoneapk.keystore -alias stone_chave -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SENHA_KEYSTORE" -keypass "$SENHA_KEYSTORE" -dname "CN=Aniceto, OU=Informatica, O=StoneApk, L=SaoPaulo, S=SP, C=BR"
          
          # Assina de forma estrita o arquivo release gerado na pasta padrão do Gradle
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore stoneapk.keystore -storepass "$SENHA_KEYSTORE" -keypass "$SENHA_KEYSTORE" platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk stone_chave
          
          # Copia e renomeia o arquivo assinado para o diretório raiz externa
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../StoneApk.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-Android-Assinado
          path: StoneApk.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project (iOS)
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add ios
          cordova prepare ios

      - name: Compress iOS Project Folder
        run: |
          # Executa o zip garantindo que o arquivo final caia no lugar certo monitorado pelo upload
          zip -r StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-iOS-Xcode-Project
          path: StoneApk-Xcode-Project.zip
