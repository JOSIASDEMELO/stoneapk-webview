name: Gerar APK e IPA (StoneApk)

on:
  workflow_dispatch: # Permite que você clique em um botão para gerar quando quiser

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Desenvolvedor</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br/StoneAPK/' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='*' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add android
          cordova build android --template=cordova-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Android-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project (iOS)
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br/StoneAPK/' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='*' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add ios
          cordova build ios --emulator

      - name: Compress iOS App
        run: |
          mkdir -p build-ios/Payload
          cp -r app/platforms/ios/build/emulator/StoneApk.app build-ios/Payload/
          cd build-ios && zip -r ../StoneApk.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-IPA
          path: StoneApk.ipa
