name: Gerar APK e Projeto iOS (StoneApk - Logo e Link Corrigidos)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          
          # Criando o config.xml apontando o icone diretamente para a raiz do projeto
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Aniceto Informatica</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          
          # Protecao de escopo para nao sair da pasta /StoneAPK/
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.brindex.php*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <preference name='KeepRunning' value='true' />" >> config.xml
          
          # Configuracao correta do icone buscando o arquivo na raiz externa
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          cordova platform add android
          cordova build android --device

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Android-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project (iOS)
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.brindex.php*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add ios
          cordova prepare ios

      - name: Compress iOS Project Folder
        run: |
          zip -r StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Xcode-Project
          path: StoneApk-Xcode-Project.zip
