name: Gerar StoneApk Completo (Android e iOS Juntos)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Ferramenta Oficial do Google (Bubblewrap)
        run: npm install -g @bubblewrap/cli

      - name: Inicializar e Compilar o APK
        run: |
          bubblewrap init --manifest="https://aniceto.com.br" --meta=twa-manifest.json || true
          echo '{"appVersion":"1.0.0","applicationId":"com.sistema.stoneapk","host":"aniceto.com.br","name":"StoneApk","launcherName":"StoneApk","startUrl":"/StoneAPK/","iconUrl":"https://aniceto.com.brlogo.png","fallbackUrl":"https://aniceto.com.br","display":"standalone","orientation":"any","themeColor":"#000000","backgroundColor":"#000000","signingKey":{"path":"./stoneapk.keystore","alias":"stone_chave"},"features":{"playBilling":false},"alphaDependencies":{"enabled":false},"enableNotifications":false,"webShareTarget":false,"shareTarget":false,"navigationColor":"#000000","navigationColorDark":"#000000","navigationDividerColor":"#000000","navigationDividerColorDark":"#000000","signingKeyPass":"StoneChave123","signingStorePass":"StoneChave123"}' > twa-manifest.json
          bubblewrap build --skipSigning || true
          keytool -genkeypair -v -keystore stoneapk.keystore -alias stone_chave -keyalg RSA -keysize 2048 -validity 10000 -storepass "StoneChave123" -keypass "StoneChave123" -dname "CN=Aniceto, OU=Informatica, O=StoneApk, L=SaoPaulo, S=SP, C=BR"
          bubblewrap build --signingKeyPath=./stoneapk.keystore --signingKeyAlias=stone_chave --signingKeyPassword="StoneChave123" --signingStorePassword="StoneChave123" || true
          
          # Coleta o arquivo assinado do local correto onde o Bubblewrap salva nativamente
          cp app-release-signed.apk ./StoneApk.apk || cp app-release-unsigned-aligned.apk ./StoneApk.apk || cp ./app/build/outputs/apk/release/*.apk ./StoneApk.apk || true

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-Android-Assinado
          path: ./StoneApk.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project (iOS)
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add ios
          cordova prepare ios

      - name: Compress iOS Project Folder
        run: |
          zip -r ./StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-iOS-Xcode-Project
          path: ./StoneApk-Xcode-Project.zip
