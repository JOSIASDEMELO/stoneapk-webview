name: Gerar APK Assinado Direto e Projeto iOS (StoneApk)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          
          # Criando o config.xml apontando de forma estrita para a pasta do sistema
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Aniceto Informatica</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          
          # Permite carregar recursos estáticos e scripts da raiz do domínio
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='http://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          
          echo "    <preference name='KeepRunning' value='true' />" >> config.xml
          echo "    <preference name='AllowInlineMediaPlayback' value='true' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          cordova platform add android
          cordova build android --release

      - name: Assinar APK com Chave Interna do Script
        run: |
          cd app
          # Cria a assinatura usando uma senha padrão imutável de compilação
          keytool -genkeypair -v -keystore stoneapk.keystore -alias stone_chave -keyalg RSA -keysize 2048 -validity 10000 -storepass "StoneChave123" -keypass "StoneChave123" -dname "CN=Aniceto, OU=Informatica, O=StoneApk, L=SaoPaulo, S=SP, C=BR"
          
          # Captura o pacote compilado em modo de produção e injeta a criptografia
          APK_PATH=$(find platforms/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore stoneapk.keystore -storepass "StoneChave123" -keypass "StoneChave123" "$APK_PATH" stone_chave
          cp "$APK_PATH" ../StoneApk.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-Android-Assinado
          path: StoneApk.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project (iOS)
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml
          cordova platform add ios
          cordova prepare ios

      - name: Compress iOS Project Folder
        run: |
          zip -r StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-iOS-Xcode-Project
          path: StoneApk-iOS-Xcode-Project.zip
