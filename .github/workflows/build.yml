name: Gerar StoneApk Final Unificado (Android e iOS)

on:
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: macos-latest # Roda tudo em Mac para garantir compatibilidade total de caminhos
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.sistema.stoneapk StoneApk
          cd app
          
          # Criando o config.xml corrigido e travado na pasta /StoneAPK/
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.sistema.stoneapk' version='1.0.0' xmlns='http://w3.org' xmlns:cdv='http://apache.org'>" >> config.xml
          echo "    <name>StoneApk</name>" >> config.xml
          echo "    <description>App StoneApk</description>" >> config.xml
          echo "    <author>Aniceto Informatica</author>" >> config.xml
          echo "    <content src='https://aniceto.com.br' />" >> config.xml
          
          # Permite navegação interna estável sem desviar para o domínio raiz institucional
          echo "    <access origin='*' />" >> config.xml
          echo "    <allow-navigation href='https://aniceto.com.br*' />" >> config.xml
          echo "    <allow-navigation href='http://aniceto.com.br*' />" >> config.xml
          echo "    <allow-intent href='http://*/*' />" >> config.xml
          echo "    <allow-intent href='https://*/*' />" >> config.xml
          
          echo "    <preference name='KeepRunning' value='true' />" >> config.xml
          echo "    <preference name='AllowInlineMediaPlayback' value='true' />" >> config.xml
          echo "    <icon src='../logo.png' />" >> config.xml
          echo "</widget>" >> config.xml

      - name: Compilar e Assinar Plataforma Android
        run: |
          cd app
          cordova platform add android
          cordova build android --release
          
          # Cria o arquivo keystore com a senha oculta do seu GitHub
          keytool -genkeypair -v -keystore stoneapk.keystore -alias stone_chave -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=Aniceto, OU=Informatica, O=StoneApk, L=SaoPaulo, S=SP, C=BR"
          
          # Assina o APK gerado no local padrão do Cordova
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore stoneapk.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk stone_chave
          
          # Move e renomeia o arquivo para a raiz do repositório
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../StoneApk.apk

      - name: Configurar Plataforma iOS
        run: |
          cd app
          cordova platform add ios
          cordova prepare ios
          cd ..
          # Compacta a estrutura completa do iOS na raiz do projeto
          zip -r ./StoneApk-Xcode-Project.zip app/platforms/ios/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-Android-Assinado
          path: StoneApk.apk

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: StoneApk-iOS-Xcode-Project
          path: StoneApk-Xcode-Project.zip
